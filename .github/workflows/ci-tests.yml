name: ci-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unitaires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable + clippy
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # ha-mcp contre de vrais conteneurs Home Assistant (onboarding, services, tableau de bord, intégration, list_changed)
  reel:
    needs: unitaires
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cible: [stable, "2025.6", "2024.6"]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hamcp-test-mcp:local .
      - run: python3 -I tests/reel/test_reel.py --sortie resultats ${{ matrix.cible }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-${{ matrix.cible }}
          path: resultats
